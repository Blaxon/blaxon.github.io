baseURL = 'https://xanderhang.com/'
locale = 'zh-cn'
hasCJKLanguage = true
title = 'XanderHang'
theme = 'hugo-blog-awesome'
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"]

[services]
  [services.googleAnalytics]
    id = 'G-0QZZR18RF7'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"

[params]
  sitename = "XanderHang"
  brand = "XanderHang"
  description = "记录与备份 —— 属于自己的数字资产"
  blogIntro = "记录工作、生活与折腾过程中的点滴思考。"

  # Site is always dark — the toggle button has been removed (see
  # layouts/_partials/header.html and assets/js/theme.js).
  defaultColor = "dark"

  # which section .Site.RegularPages home.html should pull "recent posts" from
  mainSections = ["blog"]

  toc = true
  tocOpen = false
  goToTop = true
  dateFormat = "2006年01月02日"
  rssFeedDescription = "summary"

  # loaded on every page, before </body> — see assets/js/custom.js
  additionalScripts = ["js/custom.js"]

  [params.author]
    name = "XanderHang"

  [params.webmanifest]
    theme_color = "#2563eb"

  [params.hero]
    title = "Hi, 欢迎来到XanderHang的博客👏"
    role = ""
    summary = "内容持续更新中..."
    location = ""
    focus = ""

    nowLabel = "近况"
    nowIntroPrefix = "最近更新："
    nowDate = "2026-09-22"
    now = [
      "玩 City Skyline2 修桥补路",
      "费了一番功夫，新主题全新上线~"
    ]

  [params.home]
    showNowSection = true
    showLatestPosts = true
    latestPostsLimit = 5
    blogTitle = "最新文章"
    blogSubtitle = ""

  [[params.socialIcons]]
    name = "discord"
    url = "https://discord.gg/9BcyWcHpV"
    title = "Discord"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Blaxon"
    title = "GitHub"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:contact@xanderhang.com"
    title = "Email"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"
    title = "RSS"

[menu]
  [[menu.main]]
    name = "首页"
    pageRef = "/"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "文章"
    pageRef = "blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "关于"
    pageRef = "about"
    url = "/about/"
    weight = 3

  [[menu.main]]
    name = "装备"
    pageRef = "uses"
    url = "/uses/"
    weight = 4

  [[menu.main]]
    name = "粉馆"
    pageRef = "fenguan"
    url = "/fenguan/"
    weight = 5
