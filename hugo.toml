baseURL = 'https://xanderhang.com/'
locale = 'zh-cn'
hasCJKLanguage = true
title = 'XanderHang'
theme = 'minimal-black'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  brand = "XanderHang"
  logo = "favicon.png"
  description = "记录与备份 —— 属于自己的数字资产"
  blogIntro = "记录工作、生活与折腾过程中的点滴思考。"

  [params.theme]
    defaultTheme = "light"

  [params.home]
    sections = ["hero", "now", "posts"]
    showNowSection = true
    showFeaturedProjects = false
    showLatestPosts = true
    latestPostsLimit = 5
    blogTitle = "最新文章"
    blogSubtitle = ""

  # 先用主题自带的默认文案，看完效果再自己改
  [params.hero]
    badge = "Any Engineer"
    title = "Hi, 欢迎来到XanderHang的博客👏"
    role = ""
    summary = "博客新开张，功能稍显简陋，请多包涵~ 内容持续更新中..."
    location = "Queenstown, Singapore"
    focus = "Currently focusing on Blog development"
    available = true
    availableLabel = "Avail for chat"

    nowLabel = "近况"
    nowIntro = "最近更新：2026-09-08"
    now = [
      "《沧浪之水》读完了，很沉重，小说很写实，心理描写也很细腻",
      "正在读《大明王朝1566》，不愧为大作，很好看",
      "学习双拼输入法一周了，比拼音输入节奏舒服很多"
    ]

  [params.icons]
    useFontAwesome = true
    useDevicon = false

  [params.analytics]
    googleAnalytics = "G-0QZZR18RF7"

[menu]
  [[menu.main]]
    name = "首页"
    pageRef = "/"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "博客"
    pageRef = "blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "关于"
    pageRef = "about"
    url = "/about/"
    weight = 3

  [[menu.main]]
    name = "装备"
    pageRef = "uses"
    url = "/uses/"
    weight = 4

  [[menu.main]]
    name = "粉馆"
    pageRef = "fenguan"
    url = "/fenguan/"
    weight = 5

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "monokai"

[taxonomies]
  tag = "tags"
