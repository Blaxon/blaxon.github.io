baseURL = 'https://xanderhang.com/'
locale = 'zh-cn'
hasCJKLanguage = true
title = 'XanderHang'
theme = 'minimal-black'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  brand = "XanderHang"
  logo = "favicon.png"
  description = "记录与备份 —— 属于自己的数字资产"
  blogIntro = "记录工作、生活与折腾过程中的点滴思考。"

  [params.theme]
    defaultTheme = "light"

  [params.home]
    sections = ["hero", "now", "posts"]
    showNowSection = true
    showFeaturedProjects = false
    showLatestPosts = true
    latestPostsLimit = 5
    blogTitle = "最新文章"
    blogSubtitle = ""

  # 先用主题自带的默认文案，看完效果再自己改
  [params.hero]
    title = "Hi, 欢迎来到XanderHang的博客👏"
    role = ""
    summary = "博客新开张，内容持续更新中..."
    location = ""
    focus = "Focusing on blog development"

    nowLabel = "近况"
    nowIntro = "最近更新：2026-09-18"
    now = [
      "《大明王朝1566》读完了，比看复仇者联盟还过瘾",
      "在读《何以为证》里面的小故事还挺有趣的"
    ]

  [params.icons]
    useFontAwesome = true
    useDevicon = false

  [params.analytics]
    googleAnalytics = "G-0QZZR18RF7"

  [params.about.alt]
    [[params.about.alt.stats]]
      value = "9+"
      label = "Years Coding"

    [[params.about.alt.stats]]
      value = "23+"
      label = "Years Gaming"

    [[params.about.alt.stats]]
      value = "∞"
      label = "Hours Spent"

  [[params.social]]
    label = "Discord"
    url = "https://discord.gg/9BcyWcHpV"
    icon = "fa-brands fa-discord"

  [[params.social]]
    label = "GitHub"
    url = "https://github.com/Blaxon"
    icon = "fa-brands fa-github"

  [[params.social]]
    label = "Email"
    url = "mailto:contact@xanderhang.com"
    icon = "fa-regular fa-envelope"

  [[params.social]]
    label = "RSS"
    url = "/index.xml"
    icon = "fa-solid fa-rss"

[menu]
  [[menu.main]]
    name = "首页"
    pageRef = "/"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "博客"
    pageRef = "blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "关于"
    pageRef = "about"
    url = "/about/"
    weight = 3

  [[menu.main]]
    name = "装备"
    pageRef = "uses"
    url = "/uses/"
    weight = 4

  [[menu.main]]
    name = "粉馆"
    pageRef = "fenguan"
    url = "/fenguan/"
    weight = 5

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "monokai"

[taxonomies]
  tag = "tags"
