items:
  - id: beef
    name: 牛肉粉
    mood: 10
    flavorTexts:
      - "老板加了一大勺卤汁，牛肉炖得软烂，吃完浑身冒汗。"
      - "汤头浓郁，牛肉给得够厚道，值这个价。"
      - "辣椒油飘了一层，第一口就上头。"

  - id: suanla
    name: 酸辣粉
    mood: 15
    flavorTexts:
      - "酸辣得眼泪都下来了，但根本停不下来。"
      - "红油泼得够猛，鼻子都通了。"
      - "老板说这碗是今天调得最好的一碗醋。"

  - id: luosifen
    name: 螺蛳粉
    mood: 8
    flavorTexts:
      - "隔壁桌的人闻着味儿都想点一碗。"
      - "臭是臭，但嗦一口就懂了为什么这么多人上瘾。"
      - "花生和腐竹给得很足，老板手一抖多加了一份。"

  - id: guilin
    name: 桂林米粉
    mood: 12
    flavorTexts:
      - "锅烧和卤水的香味混在一起，老板手一抖多给了两片锅烧。"
      - "米粉爽滑，配菜给得实在。"
      - "老板说这是他家传了三代的卤水配方。"
