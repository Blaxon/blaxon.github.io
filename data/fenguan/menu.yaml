items:
  - id: hongshao
    name: 红烧牛肉粉
    mood: 10
    flavorTexts:
      - "老板守着卤锅炖了大半夜，红烧牛肉码子炖得酥烂，一勺盖上去汤都是红亮的。"
      - "骨头汤打底，牛肉码子给得扎实，嗦一口就知道是熬了工夫的。"
      - "辣椒油混着卤汁的香气飘出摊子老远，第一口就上头。"
    slurpTexts:
      - "嗦了一口浓汤，红烧牛肉的卤香混着热气直冲鼻子。"
      - "牛肉炖得入口就化，没嚼两下就没了，赶紧再捞一块。"
      - "汤喝下去，浑身都暖和了起来。"

  - id: mala
    name: 麻辣牛肉粉
    mood: 15
    flavorTexts:
      - "牛肉码子现炒现拌，花椒和辣椒面一起下锅，麻得舌头发颤根本停不下来。"
      - "红油泼得够猛，牛肉给得厚实，鼻子一下就通了。"
      - "粉端上来了，白白duangduang的粉上面盖着麻辣牛肉，口水都出来了。"
    slurpTexts:
      - "麻辣汤汁裹着米粉，嗦一口舌头都在打颤。"
      - "花椒的麻劲儿慢慢涌上来，越吃越上瘾。"
      - "辣得直吸气，手上的筷子还是没停下来。"

  - id: niugutou
    name: 牛骨头粉
    mood: 10
    flavorTexts:
      - "大骨头在汤锅里咕嘟了一整夜，汤色奶白，喝一口就知道熬得够久。"
      - "骨头啃得满手油，米粉吸饱了骨汤的香味，嗦得停不下来。"
      - "酸豆角和榨菜给得很足，老板手一抖多加了一勺葱花。"
    slurpTexts:
      - "骨头汤喝一口，鲜得眉毛都要掉下来。"
      - "啃了口骨头，满嘴油香，赶紧嗦一口米粉解腻。"
      - "汤鲜得舍不得放下碗，一口接一口地嗦。"

  - id: chaoma
    name: 肉丝炒码粉
    mood: 12
    flavorTexts:
      - "肉丝下锅猛火一炒，酱香和镬气混在一起，老板手一抖多给了一勺码子。"
      - "米粉裹满炒码的汁水，配菜给得实在，越嗦越香。"
      - "老板说他这手颠勺的功夫，练了小半辈子才有这镬气。"
    slurpTexts:
      - "肉丝码子嚼着带镬气，混着米粉一起嗦下去。"
      - "酱香裹满了粉条，越嗦越香。"
      - "干拌的粉条裹满酱汁，嗦得满嘴留香。"
