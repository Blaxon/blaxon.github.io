{{ define "main" }}
  {{ $menu := hugo.Data.fenguan.menu }}

  <div class="wrapper fenguan-page" data-fenguan-path="{{ .RelPermalink }}">
    <header class="header">
      <h1 class="header-title center fenguan-title">{{ .Title }}</h1>
      {{ with .Params.subtitle }}
        <p class="header-subtitle center fenguan-subtitle">{{ . }}</p>
        <p class="header-subtitle center fenguan-subtitle" data-fenguan-subtitle></p>
      {{ end }}
    </header>

    <div class="fenguan-grid">
      <!-- 左：实时日志 -->
      <div class="card fenguan-panel fenguan-panel-log">
        <div class="fenguan-log-wrap">
          <ul class="fenguan-log" data-fenguan-log>
            <li class="fenguan-muted" data-fenguan-log-empty>还没什么动静，先嗦一口暖暖场。</li>
          </ul>
          <div class="fenguan-log-fade" aria-hidden="true"></div>
        </div>
      </div>

      <!-- 中：菜单 + 动作 -->
      <div class="fenguan-panel-center">
        <div class="card fenguan-panel">
          <h2 class="fenguan-panel-title">菜单</h2>
          <ul class="fenguan-menu" data-fenguan-menu>
            {{ range $menu.items }}
              <li class="fenguan-menu-item">
                <button
                  type="button"
                  class="fenguan-menu-btn"
                  data-fenguan-order="{{ .id }}"
                >
                  <span class="fenguan-menu-btn-fill" data-fenguan-order-progress></span>
                  <span class="fenguan-menu-name">{{ .name }}</span>
                </button>
              </li>
            {{ end }}
          </ul>
        </div>

        <div class="card fenguan-panel fenguan-actions">
          <h2 class="fenguan-panel-title">动作</h2>
          <p class="fenguan-bowl-status" data-fenguan-bowl-status></p>
          <div class="fenguan-actions-row">
            <button type="button" class="fenguan-btn fenguan-btn-primary" data-fenguan-slurp>
              <span class="fenguan-btn-fill" data-fenguan-slurp-progress></span>
              <span class="fenguan-btn-label">嗦粉</span>
            </button>
            <button type="button" class="fenguan-btn" data-fenguan-message>
              留言
            </button>
          </div>
        </div>
      </div>

      <!-- 右：属性/状态 + 留言板 -->
      <div class="fenguan-panel-right">
        <div class="card fenguan-panel fenguan-panel-status">
          <h2 class="fenguan-panel-title">状态</h2>
          <dl class="fenguan-stats">
            <div class="fenguan-stat">
              <dt class="fenguan-muted">饱腹值</dt>
              <dd class="fenguan-stat-bar"><span data-fenguan-stat="satiety"></span></dd>
            </div>
            <div class="fenguan-stat">
              <dt class="fenguan-muted">心情</dt>
              <dd class="fenguan-stat-bar"><span data-fenguan-stat="mood"></span></dd>
            </div>
            <div class="fenguan-stat fenguan-stat-plain">
              <dt class="fenguan-muted">来过</dt>
              <dd class="fenguan-muted" data-fenguan-stat="visits"></dd>
            </div>
          </dl>
        </div>

        <div class="card fenguan-panel fenguan-panel-messages">
          <h2 class="fenguan-panel-title">留言板</h2>
          <ul class="fenguan-messages" data-fenguan-messages>
            <li class="fenguan-muted" data-fenguan-messages-empty>还没有人留言，来抢个沙发吧。</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="fenguan-dialog" data-fenguan-dialog>
    <div class="fenguan-dialog-backdrop" data-fenguan-dialog-close></div>
    <div class="fenguan-dialog-panel">
      <div class="fenguan-dialog-header">
        <h2 class="fenguan-dialog-title">留言</h2>
        <button
          type="button"
          class="fenguan-dialog-close"
          data-fenguan-dialog-close
          aria-label="关闭留言"
        >
          ✕
        </button>
      </div>
      <div class="fenguan-dialog-body">
        <div id="fenguan-waline" data-fenguan-waline></div>
      </div>
    </div>
  </div>

  <script type="application/json" data-fenguan-menu-data>{{ $menu }}</script>
  <script src="{{ "js/fenguan.js" | relURL }}" defer></script>
<img
    src="{{ "images/calligraphy-fenguan.png" | relURL }}"
    width="400"
    height="396"
    class="fenguan-corner-scroll"
    alt=""
    aria-hidden="true"
>
{{ end }}
